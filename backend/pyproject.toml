[project]
name = "vayumitra-backend"
version = "1.0.0"
description = "VayuMitra Clean Air & Winter Smog Action Engine Backend"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "cachetools>=5.5.0",
    "slowapi>=0.1.9",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C90",  # mccabe cyclomatic complexity
]
ignore = [
    "E501", # line length handled gracefully by formatter
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["app"]
